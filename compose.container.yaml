name: knotra-runtime

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: knotra
      POSTGRES_USER: knotra
      POSTGRES_PASSWORD: knotra-development
    ports:
      - '127.0.0.1:${KNOTRA_PG_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U knotra -d knotra']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 128

  engine:
    image: ${KNOTRA_IMAGE:-ghcr.io/knotra-dev/engine:latest}
    network_mode: host
    command: [serve, --listen, '127.0.0.1:8787', --profile, /etc/knotra/profile.yaml]
    environment:
      KNOTRA_DATABASE_URL: postgres://knotra:knotra-development@127.0.0.1:${KNOTRA_PG_PORT:-25432}/knotra?sslmode=disable
      KNOTRA_DATA_DIR: ${KNOTRA_CONTAINER_DATA_DIR:-${PWD}/.knotra-container}
      KNOTRA_FIREWALL_IMAGE: ${KNOTRA_FIREWALL_IMAGE:-ghcr.io/knotra-dev/firewall:latest}
      KNOTRA_TOKEN: ${KNOTRA_TOKEN:-}
    volumes:
      - ${KNOTRA_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Sandbox bind sources must have the same absolute path on the host and in the engine.
      - ${KNOTRA_CONTAINER_DATA_DIR:-${PWD}/.knotra-container}:${KNOTRA_CONTAINER_DATA_DIR:-${PWD}/.knotra-container}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, knotra, info]
      interval: 3s
      timeout: 3s
      retries: 20

  cli:
    profiles: [tools]
    image: ${KNOTRA_IMAGE:-ghcr.io/knotra-dev/engine:latest}
    network_mode: host
    working_dir: /workspace
    environment:
      KNOTRA_ENDPOINT: ${KNOTRA_ENDPOINT:-http://127.0.0.1:8787}
      KNOTRA_PROFILE: ${KNOTRA_PROFILE:-local}
      KNOTRA_TOKEN: ${KNOTRA_TOKEN:-}
      KNOTRA_STATE_DIR: /workspace/.knotra-cli
    volumes:
      - ${PWD}:/workspace

  python:
    profiles: [tools]
    image: python:3.13-alpine

  node:
    profiles: [tools]
    image: node:22-alpine

  firewall:
    profiles: [tools]
    image: ${KNOTRA_FIREWALL_IMAGE:-ghcr.io/knotra-dev/firewall:latest}

volumes:
  postgres-data:
