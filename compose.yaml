name: knotra

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: knotra
      POSTGRES_USER: knotra
      POSTGRES_PASSWORD: ${KNOTRA_DEV_DB_PASSWORD:-knotra-development}
    ports:
      - '127.0.0.1:${KNOTRA_PG_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U knotra -d knotra']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres-data:
