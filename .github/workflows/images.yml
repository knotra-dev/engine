name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_VERSION: ${{ github.event.pull_request.base.ref || github.ref_name }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.images.outputs.builds }}
      engine: ${{ steps.images.outputs.engine }}
      firewall: ${{ steps.images.outputs.firewall }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select images with unpublished build inputs
        id: images
        run: python3 scripts/select_images.py

  build:
    needs: select
    if: needs.select.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.builds) }}
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image == 'engine' && 'Dockerfile' || 'internal/adapters/firewall/Dockerfile' }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          tags: knotra-smoke:latest
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
          provenance: false
      - name: Check engine and CLI image
        if: matrix.image == 'engine'
        run: |
          docker compose -f compose.container.yaml --profile tools config --quiet
          docker run --rm knotra-smoke:latest --help
          docker run --rm knotra-smoke:latest --version
          docker run --rm --volume "$PWD/examples:/examples:ro" knotra-smoke:latest \
            validate /examples/showcase/release-gate/pipeline.yaml --profile-file /examples/local/profile.yaml
          docker run --rm --entrypoint sh knotra-smoke:latest -ec \
            'test -x /usr/local/libexec/knotra/sandbox-helper; docker --version'
      - name: Check container workflow and recovery
        if: matrix.image == 'engine'
        env:
          KNOTRA_TEST_CONTAINER_IMAGE: knotra-smoke:latest
        run: python3 scripts/test-container.py
      - name: Check firewall image
        if: matrix.image == 'firewall'
        run: docker run --rm --entrypoint iptables knotra-smoke:latest --version
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"
          docker tag knotra-smoke:latest "$tag"
          docker push "$tag"

  publish:
    needs: [select, build]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.select.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        image: [engine, firewall]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          SOURCE_IMAGE: ${{ needs.select.outputs[matrix.image] }}
          BUILT: ${{ contains(fromJSON(needs.select.outputs.builds), matrix.image) }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=("$SOURCE_IMAGE")
          if [[ "$BUILT" == true ]]; then
            args+=(--tag "$SOURCE_IMAGE")
            sources=(
              "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64"
              "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
            )
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
